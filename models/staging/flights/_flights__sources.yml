version: 2

sources:
  - name: demo_src
    description: "Данные из бд авиаперелетов"
    tables:
      - name: aircrafts
        description: "Модели самолетов"
        columns:
          - name: aircraft_code
            description: "Код модели самолета"
          - name: model
            description: "Название модели самолета"
          - name: range
            description: "Неизвестно"
      - name: airports
        description: "Аэропорты"
        columns:
          - name: airport_code
            description: "Код аэропорта"
          - name: airport_name
            description: "Название"
          - name: city
            description: "Город"
          - name: coordinates
            description: "Координаты"
          - name: timezone
            description: "Временная зона"
      - name: seats
        description: "Места в самолетах"
      - name: bookings
        description: "Бронирования"
        columns:
          - name: book_ref
            description: "Ссылка"
          - name: book_date
            description: "Дата бронирования"
          - name: total_amount
            description: "Количество"
        freshness: # default freshness
                # changed to config in v1.9
                warn_after: {count: 6, period: hour}
                error_after: {count: 10000, period: day}
        loaded_at_field: book_date::timestamp # changed to config in v1.10